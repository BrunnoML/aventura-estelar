<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Aventura Estelar — Dora, Oreo e Cacau 🐶🚀</title>
<!-- PWA: permite instalar como aplicativo (os arquivos ficam na pasta publicada) -->
<meta name="theme-color" content="#1b1b4d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
/* ============================================================
   AVENTURA ESTELAR — DORA, OREO E CACAU
   Jogo educativo (alfabetização + matemática) para 6 anos.
   Os três cachorrinhos precisam voltar para casa, mas
   zumbizinhos trapalhões bloqueiam o caminho — cada resposta
   certa derrota um zumbi num "puff" e os cães avançam!
   Arquivo único: HTML + CSS + JavaScript. Funciona offline.
   ============================================================ */

/* ---------- Variáveis de cor e reset ---------- */
:root{
  --fundo1:#1b1b4d;
  --fundo2:#3a2a6e;
  --card:#ffffff;
  --amarelo:#ffd93d;
  --laranja:#ff9f43;
  --verde:#2ecc71;
  --vermelho:#ff7675;
  --roxo:#a29bfe;
  --azul:#54a0ff;
  --rosa:#fd79a8;
  --texto:#2d3436;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:"Comic Sans MS","Chalkboard SE","Segoe UI",sans-serif;
  background:linear-gradient(180deg,var(--fundo1),var(--fundo2));
  color:#fff;overflow-x:hidden;min-height:100vh;
}
button{font-family:inherit;cursor:pointer;border:none;}

/* ---------- Estrelinhas do fundo (geradas por JS) ---------- */
#estrelas{position:fixed;inset:0;pointer-events:none;z-index:0;}
.estrela{position:absolute;background:#fff;border-radius:50%;animation:piscar 3s infinite;}
@keyframes piscar{0%,100%{opacity:.9}50%{opacity:.2}}

/* ---------- Container principal ---------- */
#app{
  position:relative;z-index:1;
  max-width:640px;margin:0 auto;
  min-height:100vh;
  padding:12px 14px 24px;
  display:flex;flex-direction:column;
}

/* ---------- Títulos e textos ---------- */
h1{font-size:clamp(1.5rem,6vw,2.3rem);text-align:center;color:var(--amarelo);
   text-shadow:0 3px 0 rgba(0,0,0,.3);line-height:1.2;}
.subtitulo{text-align:center;font-size:clamp(.95rem,4vw,1.15rem);color:#e0d9ff;margin-top:6px;}

/* ---------- Botões grandes ---------- */
.btn{
  display:block;width:100%;
  padding:16px 20px;margin:10px 0;
  font-size:clamp(1.1rem,4.5vw,1.4rem);font-weight:bold;
  border-radius:22px;color:#fff;
  background:linear-gradient(180deg,var(--azul),#2e86de);
  box-shadow:0 5px 0 rgba(0,0,0,.25);
  transition:transform .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25);}
.btn-amarelo{background:linear-gradient(180deg,var(--amarelo),#f6b93b);color:#5d4400;}
.btn-verde{background:linear-gradient(180deg,var(--verde),#27ae60);}
.btn-roxo{background:linear-gradient(180deg,var(--roxo),#6c5ce7);}

/* ---------- Barra superior (HUD) ---------- */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
.hud .icone-btn{
  background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  border-radius:14px;font-size:1.4rem;padding:8px 14px;color:#fff;
}
.hud .pontos{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.2);
  border-radius:14px;padding:8px 14px;font-weight:bold;font-size:1rem;white-space:nowrap;}

/* ---------- Bolinhas de progresso dos desafios ---------- */
.dots{display:flex;gap:8px;justify-content:center;margin:2px 0 10px;}
.dot{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.25);transition:.3s;}
.dot.feito{background:var(--verde);}
.dot.atual{background:var(--amarelo);transform:scale(1.3);box-shadow:0 0 10px var(--amarelo);}

/* ============================================================
   CENA DO CAMINHO DE CASA (cães + zumbi + casinha)
   ============================================================ */
.cena{
  position:relative;height:176px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,#20204f 0%,#413178 66%);
  border:2px solid rgba(255,255,255,.15);
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  margin-bottom:12px;flex-shrink:0;
}
.cena .chao{position:absolute;left:0;right:0;bottom:0;height:32%;
  background:linear-gradient(180deg,#37b45f,#1d7a3f);}
.cena .morro{position:absolute;background:#2c2c67;border-radius:50%;filter:blur(1px);}
.cena .lua{position:absolute;top:12px;left:16px;width:34px;height:34px;border-radius:50%;
  background:#fdf6d8;box-shadow:0 0 18px #fdf6d8aa;}
.cena .lua::after{content:"";position:absolute;left:6px;top:7px;width:9px;height:9px;
  border-radius:50%;background:#e8dfb8;}
.cena .estrelinha{position:absolute;color:#fff;font-size:.55rem;opacity:.8;animation:piscar 2.5s infinite;}

/* Casinha dos cachorros */
.casa{position:absolute;right:3%;bottom:26%;width:72px;height:54px;
  background:linear-gradient(180deg,#f6d186,#e9b96a);border-radius:4px;z-index:2;}
.casa::before{ /* telhado */
  content:"";position:absolute;left:-11px;top:-30px;
  border-left:47px solid transparent;border-right:47px solid transparent;
  border-bottom:32px solid #e17055;
}
.casa .porta{position:absolute;left:9px;bottom:0;width:19px;height:28px;
  background:#8a5a34;border-radius:9px 9px 0 0;}
.casa .janela{position:absolute;right:9px;top:12px;width:17px;height:17px;
  background:#ffeaa7;border-radius:4px;box-shadow:0 0 14px #ffeaa7;}

/* ---------- Cachorrinhos (CSS puro, virados para a direita) ---------- */
#matilha{position:absolute;bottom:21%;left:2%;width:136px;height:48px;
  transition:left 1.1s ease-in-out;z-index:3;}
.dog{position:absolute;bottom:0;width:48px;height:44px;}
.dog .nome{position:absolute;top:-15px;width:100%;text-align:center;
  font-size:.6rem;font-weight:bold;color:#fff;text-shadow:0 1px 3px #000;letter-spacing:.5px;}
.dog .corpo{position:absolute;left:0;bottom:11px;width:38px;height:20px;
  background:var(--pelo);border-radius:12px 9px 9px 12px;}
.dog .cabeca{position:absolute;right:-4px;bottom:21px;width:22px;height:20px;
  background:var(--pelo);border-radius:50% 55% 50% 45%;z-index:2;}
.dog .orelha{position:absolute;left:0;top:-6px;width:9px;height:14px;
  background:var(--pelo2);border-radius:50%;transform:rotate(-18deg);}
.dog .olho{position:absolute;right:5px;top:6px;width:4px;height:4px;background:#1e1e1e;border-radius:50%;}
.dog .focinho{position:absolute;right:-5px;bottom:2px;width:12px;height:9px;
  background:var(--focinho,#f7e6d3);border-radius:6px;}
.dog .focinho::after{content:"";position:absolute;right:0;top:2px;width:4px;height:4px;
  background:#1e1e1e;border-radius:50%;}
.dog .rabo{position:absolute;left:-9px;bottom:22px;width:14px;height:6px;
  background:var(--pelo2);border-radius:4px;transform-origin:right center;animation:abanar .5s infinite;}
.dog .pata{position:absolute;bottom:-1px;width:6px;height:13px;background:var(--pelo2);
  border-radius:3px;transform-origin:top center;}
.dog .p1{left:3px}.dog .p2{left:12px}.dog .p3{left:23px}.dog .p4{left:31px}
.dog.andando .p1,.dog.andando .p3{animation:passo .38s infinite;}
.dog.andando .p2,.dog.andando .p4{animation:passo .38s infinite .19s;}
.dog.andando .corpo,.dog.andando .cabeca{animation:trotar .38s infinite;}
@keyframes abanar{0%,100%{transform:rotate(16deg)}50%{transform:rotate(42deg)}}
@keyframes passo{0%,100%{transform:rotate(20deg)}50%{transform:rotate(-20deg)}}
@keyframes trotar{0%,100%{margin-bottom:0}50%{margin-bottom:1.5px}}
/* As cores de cada cachorro */
.dog.dora {--pelo:#e6a15e;--pelo2:#c07c3c;}
.dog.oreo {--pelo:#474760;--pelo2:#2e2e42;--focinho:#f2f2f2;}
.dog.cacau{--pelo:#8a5a34;--pelo2:#66401f;}
/* Cachorro parado em telas de vitória */
.dog-wrap{position:relative;display:inline-block;width:64px;height:62px;}
.dog-wrap .dog{left:6px;}

/* ---------- Zumbizinho na cena ---------- */
#zumbiCena{position:absolute;left:67%;bottom:22%;width:90px;height:100px;
  transform:scale(.62);transform-origin:bottom left;z-index:3;}
#zumbiCena.entrando{animation:chegar .5s backwards;}
#zumbiCena.derrotado{animation:poof .7s forwards;}
#zumbiCena.riso{animation:tremer .5s;}
@keyframes chegar{from{transform:scale(0) translateY(-40px);opacity:0}
  to{transform:scale(.62) translateY(0);opacity:1}}
@keyframes poof{40%{transform:scale(.75) rotate(180deg)}
  100%{transform:scale(0) rotate(560deg);opacity:0}}
.chapeu{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-size:1.8rem;}
.puff{font-size:2.6rem;animation:subiu 1s forwards;}
@keyframes subiu{to{transform:translateY(-30px) scale(1.6);opacity:0}}

/* Zumbis pulando no lugar (o pulo anima "bottom" para não brigar
   com o transform de escala dos zumbis menores) */
#zumbiCena .zumbi{position:absolute;bottom:0;left:0;animation:pular 1.5s ease-in-out infinite;}
#zumbiCena .zumbi.z1{left:48px;transform:scale(.8);transform-origin:bottom center;animation-delay:.35s;}
#zumbiCena .zumbi.z2{left:-42px;transform:scale(.66);transform-origin:bottom center;animation-delay:.7s;}
@keyframes pular{0%,100%{bottom:0}50%{bottom:7px}}

/* ---------- Cenários variados da cena ---------- */
.meta{position:absolute;right:4%;bottom:24%;font-size:3rem;z-index:2;} /* petisco, bolinha, abrigo, vovó */
.nuvem{position:absolute;top:6px;font-size:2rem;z-index:2;}
.gota{position:absolute;top:-12px;width:3px;height:11px;background:#9ecbff;
  border-radius:2px;opacity:.7;animation:chover linear infinite;z-index:2;}
@keyframes chover{to{transform:translateY(200px)}}
.chao.rua{background:linear-gradient(180deg,#70707e,#4a4a55);} /* rua para atravessar */
.faixa{position:absolute;bottom:9%;left:0;right:0;height:12px;z-index:1;
  background:repeating-linear-gradient(90deg,#fff 0 24px,transparent 24px 48px);opacity:.75;}

/* Animações divertidas da matilha */
.dog.pula{animation:pulinhoDog .55s;}
@keyframes pulinhoDog{50%{transform:translateY(-14px)}}
.balao{position:absolute;top:-32px;left:50%;transform:translateX(-50%);
  background:#fff;color:#333;font-size:.62rem;font-weight:bold;
  padding:2px 8px;border-radius:10px;white-space:nowrap;animation:pop .3s;z-index:5;}

/* ---------- Faixa de feedback dentro da cena ---------- */
#banner{
  position:absolute;top:10px;left:50%;transform:translateX(-50%) scale(.6);
  padding:9px 20px;border-radius:22px;font-weight:bold;
  font-size:clamp(.95rem,4vw,1.15rem);white-space:nowrap;
  opacity:0;transition:all .25s;pointer-events:none;z-index:6;
  box-shadow:0 4px 14px rgba(0,0,0,.4);
}
#banner.mostra{opacity:1;transform:translateX(-50%) scale(1);}
#banner.bom{background:linear-gradient(180deg,#55efc4,#00b894);color:#fff;}
#banner.quase{background:linear-gradient(180deg,#ffd93d,#f6b93b);color:#5d4400;}

/* ---------- Cartão do desafio ---------- */
.cartao{
  background:var(--card);color:var(--texto);
  border-radius:26px;padding:16px 14px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);
  text-align:center;
}
.pergunta{font-size:clamp(1.1rem,4.6vw,1.4rem);font-weight:bold;line-height:1.35;}
.pergunta .lacuna{color:#e17055;letter-spacing:2px;}
.pergunta .historia{ /* historinha lida antes da pergunta (missão de valores) */
  font-size:.82em;font-weight:normal;color:#57606f;
  line-height:1.45;margin-bottom:10px;}
.btn-falar{background:var(--roxo);color:#fff;border-radius:50%;
  width:48px;height:48px;font-size:1.4rem;margin:10px auto 0;display:block;
  box-shadow:0 4px 0 rgba(0,0,0,.2);}
.btn-falar:active{transform:translateY(2px);}

/* Área visual (emojis, quantidades, palavra) */
.visual{font-size:clamp(1.7rem,7.5vw,2.5rem);margin:10px 0 4px;line-height:1.5;word-break:break-word;}
.visual .grupo5{display:inline-block;margin:0 8px 4px 0;}
.visual .sumiu{opacity:.28;position:relative;}
.visual .sumiu::after{content:"✖";position:absolute;left:50%;top:50%;
  transform:translate(-50%,-55%);font-size:.6em;color:#d63031;}
.palavra-grande{font-size:clamp(1.8rem,8vw,2.7rem);letter-spacing:6px;font-weight:bold;color:#4834d4;}

/* ---------- Opções de resposta ---------- */
.opcoes{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:12px;margin-top:14px;}
.opcao{
  background:linear-gradient(180deg,#74b9ff,#4b7bec);color:#fff;
  border-radius:20px;padding:16px 8px;
  font-size:clamp(1.3rem,6vw,1.9rem);font-weight:bold;
  box-shadow:0 5px 0 #2f5fc4;
  transition:transform .1s;min-height:62px;
}
.opcao:active{transform:translateY(3px);box-shadow:0 2px 0 #2f5fc4;}
@media (hover:hover){.opcao:hover{transform:scale(1.04);}}
.opcao.certa{background:linear-gradient(180deg,#55efc4,#00b894)!important;
  box-shadow:0 5px 0 #009474!important;animation:pulinho .5s;}
.opcao.errada{animation:tremer .4s;background:linear-gradient(180deg,#fab1a0,#e17055)!important;
  box-shadow:0 5px 0 #c05a3e!important;}
.opcao.grupo{font-size:clamp(1.05rem,4.5vw,1.4rem);line-height:1.4;}
.opcao.texto{font-size:clamp(.95rem,4vw,1.15rem);line-height:1.35;} /* respostas em frase (valores) */
.num-opcao{ /* número 1/2/3 em cada opção — a voz lê "Opção 1..." */
  display:block;width:26px;height:26px;line-height:26px;margin:0 auto 6px;
  border-radius:50%;background:rgba(255,255,255,.45);color:#2d3436;
  font-size:.95rem;font-weight:bold;}
@keyframes tremer{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pulinho{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}

/* Cristal que voa quando acerta */
.cristal-voa{position:fixed;font-size:1.6rem;font-weight:bold;color:#7ee8fa;
  text-shadow:0 2px 4px rgba(0,0,0,.5);pointer-events:none;z-index:60;
  animation:voar 1.1s forwards;}
@keyframes voar{to{transform:translateY(-90px) scale(1.3);opacity:0}}

/* ---------- Desafio de montar palavra (peças de sílabas) ---------- */
.slots{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap;}
.slot{
  min-width:70px;height:60px;border-radius:16px;
  border:3px dashed #b2bec3;background:#f5f6fa;
  display:flex;align-items:center;justify-content:center;
  font-size:1.7rem;font-weight:bold;color:#4834d4;
}
.slot.cheio{border-style:solid;border-color:var(--verde);background:#eafff3;animation:pop .3s;}
.pecas{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:8px;}
.peca{
  background:linear-gradient(180deg,var(--amarelo),#f6b93b);color:#5d4400;
  border-radius:16px;padding:13px 18px;font-size:1.6rem;font-weight:bold;
  box-shadow:0 5px 0 #c78f2b;min-width:78px;transition:transform .1s;
}
.peca:active{transform:translateY(3px);box-shadow:0 2px 0 #c78f2b;}
.peca:disabled{opacity:.25;}
.peca.errada{animation:tremer .4s;}
@keyframes pop{0%{transform:scale(.4)}80%{transform:scale(1.15)}100%{transform:scale(1)}}

/* ---------- Mensagem rápida (missão travada etc.) ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  background:var(--laranja);color:#fff;font-weight:bold;
  padding:14px 26px;border-radius:30px;font-size:1.05rem;
  box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;pointer-events:none;
  transition:opacity .25s;z-index:50;text-align:center;max-width:90vw;
}
#toast.mostra{opacity:1;}

/* ---------- Cards de missão ---------- */
.categoria-titulo{margin:16px 4px 4px;font-size:1.02rem;font-weight:bold;
  color:var(--amarelo);text-shadow:0 1px 3px rgba(0,0,0,.5);}
.missao-card{
  display:flex;align-items:center;gap:14px;width:100%;
  background:rgba(255,255,255,.12);border-radius:22px;
  padding:14px 16px;margin:8px 0;color:#fff;text-align:left;
  border:2px solid rgba(255,255,255,.15);transition:transform .1s;
}
.missao-card:active{transform:scale(.98);}
.missao-card .icone{font-size:2.4rem;}
.missao-card .info{flex:1;}
.missao-card .nome{font-size:1.15rem;font-weight:bold;}
.missao-card .estrelas{font-size:.95rem;color:var(--amarelo);}
.missao-card.travada{opacity:.5;}

/* ---------- Planetas (fases) ---------- */
.planetas{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px;}
.planeta{
  border-radius:24px;padding:18px 10px;color:#fff;text-align:center;
  background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);
  transition:transform .1s;
}
.planeta .bola{font-size:2.6rem;}
.planeta .titulo{font-weight:bold;margin-top:4px;font-size:1.05rem;}
.planeta .fase-estrelas{color:var(--amarelo);font-size:1.1rem;margin-top:4px;min-height:1.3em;}
.planeta:active{transform:scale(.97);}
.planeta.travado{opacity:.45;}

/* ---------- Zumbizinho trapalhão (CSS puro) ---------- */
.zumbi{width:90px;height:100px;position:relative;}
.zumbi.solto{margin:6px auto;animation:flutuar 2.4s ease-in-out infinite .5s;}
@keyframes flutuar{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.zumbi .cabeca{
  width:78px;height:70px;margin:0 auto;border-radius:46% 46% 42% 42%;
  background:linear-gradient(180deg,#7bed9f,#2ed573);position:relative;
}
.zumbi .olhog{position:absolute;top:16px;width:24px;height:24px;background:#fff;border-radius:50%;border:2px solid #2f3542;}
.zumbi .olhog::after{content:"";position:absolute;left:6px;top:8px;width:9px;height:9px;background:#2f3542;border-radius:50%;}
.zumbi .olhog.e{left:10px;} .zumbi .olhog.d{right:10px;top:22px;width:18px;height:18px;}
.zumbi .olhog.d::after{left:4px;top:5px;width:7px;height:7px;}
.zumbi .boca{position:absolute;bottom:8px;left:50%;transform:translateX(-50%) rotate(-6deg);
  width:30px;height:14px;background:#2f3542;border-radius:0 0 24px 24px;overflow:hidden;}
.zumbi .lingua{position:absolute;bottom:-4px;left:8px;width:14px;height:10px;background:var(--rosa);border-radius:50%;}
.zumbi .antena{position:absolute;top:-12px;left:50%;width:4px;height:16px;background:#2ed573;transform:translateX(-50%);}
.zumbi .antena::after{content:"";position:absolute;top:-9px;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--amarelo);}

.mascotes{display:flex;justify-content:center;align-items:flex-end;gap:14px;margin:14px 0;}

/* ---------- Tela de recompensa ---------- */
.estrelas-grandes{font-size:3.4rem;text-align:center;margin:10px 0;letter-spacing:6px;}
.estrelas-grandes span{display:inline-block;animation:pop .6s backwards;}
.estrelas-grandes span:nth-child(2){animation-delay:.25s;}
.estrelas-grandes span:nth-child(3){animation-delay:.5s;}
.adesivo-novo{
  background:rgba(255,255,255,.14);border-radius:22px;padding:14px;
  text-align:center;margin:12px 0;border:2px dashed var(--amarelo);
}
.adesivo-novo .fig{font-size:3rem;animation:pop .6s .7s backwards;display:inline-block;}

/* Confete da vitória */
.confete{position:fixed;top:-20px;font-size:1.4rem;z-index:30;pointer-events:none;
  animation:cair linear forwards;}
@keyframes cair{to{transform:translateY(110vh) rotate(720deg);}}

/* ---------- Tela dos pais (progresso) ---------- */
.tabela-prog{width:100%;background:rgba(255,255,255,.1);border-radius:18px;
  padding:12px;margin:10px 0;font-size:.98rem;}
.linha-prog{display:flex;justify-content:space-between;align-items:center;
  padding:8px 6px;border-bottom:1px solid rgba(255,255,255,.12);}
.linha-prog:last-child{border-bottom:none;}
.hab-linha{display:flex;justify-content:space-between;align-items:center;
  font-size:.82rem;opacity:.92;padding:2px 6px 2px 20px;}
.hab-linha .hab-rotulo{color:var(--amarelo);white-space:nowrap;margin-left:8px;}
.legenda-hab{font-size:.78rem;text-align:center;opacity:.85;margin:4px 0 8px;}
.campo-email{width:100%;max-width:320px;padding:12px 14px;border-radius:14px;border:none;
  font-family:inherit;font-size:1rem;margin:10px auto;display:block;text-align:center;}
.adesivos-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;
  background:rgba(255,255,255,.1);border-radius:18px;padding:14px;margin:10px 0;}

/* ============================================================
   1b. SINCRONIZAÇÃO NA NUVEM (Supabase, opcional)
   Modelo do relatório pedagógico: o ADULTO entra com "link
   mágico" (sem senha) e o progresso da criança viaja entre os
   aparelhos da família. A criança nunca precisa de conta.
   ============================================================ */
let nuvem = { cliente:null, usuario:null, timer:null };

async function iniciarNuvem(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return;   // nuvem desativada
  try{
    const mod = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    nuvem.cliente = mod.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const { data:{ session } } = await nuvem.cliente.auth.getSession();
    if(session){ nuvem.usuario = session.user; await baixarProgressoNuvem(); }
    nuvem.cliente.auth.onAuthStateChange((_evento, sess)=>{
      nuvem.usuario = sess ? sess.user : null;
      if(nuvem.usuario) baixarProgressoNuvem();
    });
  }catch(e){ /* sem internet ou CDN bloqueada: segue 100% local */ }
}

/* Junta o progresso local com o da nuvem SEM perder nada:
   estrelas e cristais ficam com o melhor resultado; adesivos se
   somam; tentativas ficam com o histórico mais completo. */
function mesclarEstados(local, remoto){
  if(!remoto) return local;
  const m = JSON.parse(JSON.stringify(local));
  m.cristais = Math.max(local.cristais||0, remoto.cristais||0);
  m.estrelas = {};
  new Set([...Object.keys(local.estrelas||{}), ...Object.keys(remoto.estrelas||{})])
    .forEach(k=> m.estrelas[k] = Math.max((local.estrelas||{})[k]||0, (remoto.estrelas||{})[k]||0));
  m.adesivos = [...new Set([...(local.adesivos||[]), ...(remoto.adesivos||[])])];
  m.tentativas = Object.assign({}, local.tentativas||{});
  Object.keys(remoto.tentativas||{}).forEach(k=>{
    if((m.tentativas[k]||[]).length < remoto.tentativas[k].length)
      m.tentativas[k] = remoto.tentativas[k];
  });
  return m;
}

async function baixarProgressoNuvem(){
  try{
    const { data } = await nuvem.cliente.from('progresso')
      .select('dados').eq('user_id', nuvem.usuario.id).maybeSingle();
    estado = Object.assign(estado, mesclarEstados(estado, data ? data.dados : null));

function agendarEnvioNuvem(){
  if(!nuvem.cliente || !nuvem.usuario) return;
  clearTimeout(nuvem.timer);   // espera 4s de calmaria antes de enviar
  nuvem.timer = setTimeout(async ()=>{
    try{
      await nuvem.cliente.from('progresso').upsert({
        user_id: nuvem.usuario.id, dados: estado,
        updated_at: new Date().toISOString()
      });
    }catch(e){}
  }, 4000);
}

/* ============================================================
   2. SOM (bipes com WebAudio) E VOZ (leitura em pt-BR)
   ============================================================ */
let ctxAudio = null;
function bipe(freqs, dur=0.12){
  if(!estado.som) return;
  try{
    ctxAudio = ctxAudio || new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o = ctxAudio.createOscillator(), g = ctxAudio.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.22, ctxAudio.currentTime + i*dur);
      g.gain.exponentialRampToValueAtTime(.001, ctxAudio.currentTime + (i+1)*dur);
      o.connect(g); g.connect(ctxAudio.destination);
      o.start(ctxAudio.currentTime + i*dur); o.stop(ctxAudio.currentTime + (i+1)*dur);
    });
  }catch(e){}
}

/* ----- Escolha da melhor voz para CADA idioma -----
   O jogo fala pt-BR, inglês, espanhol e francês. Para cada idioma
   escolhemos a voz mais natural instalada no aparelho (neurais e
   "aprimoradas" ganham nota maior; as robóticas, nota menor). */
let cacheVozes = {};
function vozPara(lang){
  if(cacheVozes[lang] !== undefined) return cacheVozes[lang];
  if(!('speechSynthesis' in window)) return (cacheVozes[lang] = null);
  const prefixo = lang.slice(0,2).toLowerCase();
  const vozes = speechSynthesis.getVoices()
    .filter(v => v.lang.replace('_','-').toLowerCase().startsWith(prefixo));
  if(!vozes.length) return (cacheVozes[lang] = null);
  /* Vozes clássicas de boa qualidade em cada idioma */
  const BOAS = ['luciana','francisca','camila','maria','felipe',      // pt
    'samantha','alex','ava','allison','karen','daniel','serena','kate', // en
    'monica','mónica','paulina','marisol','jorge','diego',            // es
    'thomas','amelie','amélie','audrey','aurelie','aurélie'];         // fr
  /* Vozes de brincadeira/robóticas do sistema — nunca usar */
  const RUINS = ['albert','bad news','bahh','bells','boing','bubbles','cellos',
    'wobble','good news','jester','organ','superstar','trinoids','whisper',
    'zarvox','fred','junior','kathy','ralph','grandma','grandpa','rocko',
    'sandy','shelley','flo','eddy','reed','compact','eloquence'];
  const nota = v => {
    const nm = v.name.toLowerCase();
    let n = 0;
    if(v.lang.replace('_','-').toLowerCase() === lang.toLowerCase()) n += 8; // região certa (ex.: pt-BR)
    if(nm.includes('natural'))  n += 10;              // vozes neurais (Edge)
    if(nm.includes('premium') || nm.includes('enhanced') || nm.includes('aprimorada')) n += 7;
    if(nm.includes('google'))   n += 5;
    if(nm.includes('online'))   n += 4;
    if(BOAS.some(b=>nm.includes(b)))  n += 4;
    if(nm.includes('luciana'))        n += 2;   // voz pt-BR preferida
    if(RUINS.some(r=>nm.includes(r))) n -= 20;
    return n;
  };
  return (cacheVozes[lang] = [...vozes].sort((a,b)=>nota(b)-nota(a))[0]);
}
if('speechSynthesis' in window)
  speechSynthesis.onvoiceschanged = ()=>{ cacheVozes = {}; };

/* Fala uma sequência de trechos, cada um no seu idioma.
   Palavras estrangeiras são ditas mais devagar (rate 0.8),
   como os apps de idiomas fazem para crianças. */
function falarSeq(partes){
  /* A voz NUNCA pode travar o jogo: qualquer falha é ignorada */
  try{
    if(!estado.som || !('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    partes.forEach(p=>{
      const u = new SpeechSynthesisUtterance(p.t);
      u.lang = p.lang || 'pt-BR';
      const voz = vozPara(u.lang);
      if(voz) u.voice = voz;
      u.rate = p.rate || ((u.lang !== 'pt-BR') ? 0.8 : 0.95);
      u.pitch = 1.0;
      speechSynthesis.speak(u);
    });
  }catch(e){}
}
function falar(texto){ falarSeq([{t:texto}]); }

/* Remove emojis e símbolos, deixando só o texto falável de uma opção */
function textoFalavel(t){
  return String(t)
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{20E3}\u{2190}-\u{21FF}]/gu,'')
    .replace(/\s+/g,' ').trim();
}
/* Monta a sequência de fala do desafio:
   enunciado → palavra estrangeira (se for de "ouvir") →
   "Opção 1..., Opção 2..., Opção 3..." para quem ainda não lê.
   Desafios com semLeituraOpcoes pulam a leitura das opções
   (ex.: "toque na letra X" — ler entregaria a resposta). */
function partesDesafio(d){
  const partes = [{t:d.fala}];
  if(jogo && jogo.introFala){ partes.unshift({t:jogo.introFala}); jogo.introFala = null; }
  if(d.estrangeira && d.estrangeira.antes)
    partes.push({t:d.estrangeira.t, lang:d.estrangeira.lang});
  if(d.tipo==='escolha' && !d.semLeituraOpcoes){
    d.opcoes.forEach((o,ix)=>{
      const txt = o.nomeFala || textoFalavel(o.t);
      if(!txt) return;
      partes.push({t:`Opção ${ix+1}:`});
      partes.push({t:txt, lang:d.langOpcoes || 'pt-BR'});
    });
  }
  return partes;
}
function falarDesafio(d){ falarSeq(partesDesafio(d)); }

/* ============================================================
   4. UTILITÁRIOS DE SORTEIO
   ============================================================ */
const rnd     = n => Math.floor(Math.random()*n);
const sorteia = a => a[rnd(a.length)];
const embaralha = a => [...a].sort(()=>Math.random()-.5);
const entre   = (a,b) => a + rnd(b-a+1);
function opcoes(certa, geraDistrator, total=3){
  const set = new Set([String(certa)]);
  let guarda = 0;
  while(set.size < total && guarda++ < 200) set.add(String(geraDistrator()));
  return embaralha([...set].map(t => ({t, ok: t === String(certa)})));
}
function emojis(e, n, sumidos=0){
  let html = '';
  for(let i=0;i<n;i++){
    const some = i >= n - sumidos;
    html += `<span class="${some?'sumiu':''}">${e}</span>`;
    if((i+1)%5===0 && i<n-1) html += '<span class="grupo5"></span> ';
  }
  return html;
}

/* ----- MISSÃO DAS LETRAS ----- */
function desafioLetras(fase, i){
  if(fase===0){
    if(i%3===0){ // rimas: ouvido antes dos olhos (consciência fonológica)
      const grupo = sorteia(RIMAS);
      const [alvo, certa] = embaralha(grupo).slice(0,2);
      const outros = embaralha(RIMAS.filter(g=>g!==grupo));
      const distr = [sorteia(outros[0]), sorteia(outros[1])];
      const opcaoHtml = x => `${x.e}<div style="font-size:.5em;letter-spacing:1px">${x.w}</div>`;
      return {tipo:'escolha',
        pergunta:`Qual palavra <span class="lacuna">RIMA</span> com ${alvo.w}?`,
        visual:`${alvo.e}<div class="palavra-grande" style="font-size:.6em">${alvo.w}</div>`,
        fala:`Qual palavra rima com ${alvo.w}? Escute o fim do som de cada uma.`,
        opcoes: embaralha([{t:opcaoHtml(certa),ok:true,nomeFala:certa.w.toLowerCase()},
          ...distr.map(x=>({t:opcaoHtml(x),ok:false,nomeFala:x.w.toLowerCase()}))])};
    }
    if(i%3===1){
      const alvo = sorteia(ALFABETO);
      return {tipo:'escolha', semLeituraOpcoes:true, // ler as letras entregaria a resposta
        pergunta:`Toque na letra <span class="lacuna">${alvo}</span>`,
        visual:'🔎', fala:`Toque na letra ${alvo}`,
        opcoes: opcoes(alvo, ()=>sorteia(ALFABETO))};
    }
    const alvo = sorteia(ALFABETO);
    return {tipo:'escolha', semLeituraOpcoes:true,
      pergunta:`Qual é a letrinha minúscula de <span class="lacuna">${alvo}</span>?`,
      visual:`<span class="palavra-grande">${alvo}</span>`,
      fala:`Qual é a letrinha minúscula de ${alvo}?`,
      opcoes: opcoes(alvo.toLowerCase(), ()=>sorteia(ALFABETO).toLowerCase())};
  }
  if(fase===1){
    const p = sorteia(INICIAIS);
    return {tipo:'escolha',
      pergunta:`Com que letra começa <span class="lacuna">${p.w}</span>?`,
      visual:p.e, fala:`Com que letra começa ${p.w.toLowerCase()}?`,
      opcoes: opcoes(p.w[0], ()=>sorteia(ALFABETO))};
  }
  if(fase===2){
    if(i%2===0){
      const p = sorteia(PALAVRAS.filter(x=>x.w.length<=4));
      const pos = rnd(p.w.length);
      const mostrada = p.w.slice(0,pos) + '_' + p.w.slice(pos+1);
      return {tipo:'escolha',
        pergunta:`Que letra falta em <span class="lacuna">${mostrada}</span>?`,
        visual:`${p.e}<div class="palavra-grande">${mostrada}</div>`,
        fala:`Que letra falta na palavra ${p.w.toLowerCase()}?`,
        opcoes: opcoes(p.w[pos], ()=>sorteia(ALFABETO))};
    }
    const idx = rnd(ALFABETO.length-1);
    return {tipo:'escolha',
      pergunta:`Qual letra vem <b>depois</b> de <span class="lacuna">${ALFABETO[idx]}</span>?`,
      visual:'🔤', fala:`Qual letra vem depois de ${ALFABETO[idx]}?`,
      opcoes: opcoes(ALFABETO[idx+1], ()=>sorteia(ALFABETO))};
  }
  if(i%3===2){
    const idx = entre(1, ALFABETO.length-1);
    return {tipo:'escolha',
      pergunta:`Qual letra vem <b>antes</b> de <span class="lacuna">${ALFABETO[idx]}</span>?`,
      visual:'🔤', fala:`Qual letra vem antes de ${ALFABETO[idx]}?`,
      opcoes: opcoes(ALFABETO[idx-1], ()=>sorteia(ALFABETO))};
  }
  const querVogal = i%2===0;
  const certa = querVogal ? sorteia(VOGAIS) : sorteia(CONSOANTES);
  const erradas = querVogal ? CONSOANTES : VOGAIS;
  return {tipo:'escolha',
    pergunta:`Toque na <span class="lacuna">${querVogal?'VOGAL':'CONSOANTE'}</span>`,
    visual:'🧲', fala:`Toque na ${querVogal?'vogal':'consoante'}`,
    opcoes: embaralha([{t:certa,ok:true},{t:sorteia(erradas),ok:false},
      {t:sorteia(erradas.filter(l=>l!==certa)),ok:false}].filter((o,ix,arr)=>
      arr.findIndex(x=>x.t===o.t)===ix))};
}

/* ----- MISSÃO DAS SÍLABAS ----- */
function desafioSilabas(fase){
  if(fase===0){
    const c = sorteia(['B','C','D','F','G','L','M','N','P','R','S','T','V']);
    const v = sorteia(VOGAIS);
    return {tipo:'escolha',
      pergunta:`<span class="lacuna">${c} + ${v}</span> formam qual sílaba?`,
      visual:'🧩', fala:`${c} mais ${v} formam qual sílaba?`,
      opcoes: opcoes(c+v, ()=>c+sorteia(VOGAIS))};
  }
  if(fase===1){
    const p = sorteia(PALAVRAS.filter(x=>x.s.length===2 && x.s.every(s=>s.length===2)));
    const pos = rnd(2);
    const mostrada = pos===0 ? '__'+p.s[1] : p.s[0]+'__';
    return {tipo:'escolha',
      pergunta:`Complete a palavra: <span class="lacuna">${mostrada}</span>`,
      visual:`${p.e}<div class="palavra-grande">${mostrada}</div>`,
      fala:`Complete a palavra ${p.w.toLowerCase()}. Qual sílaba está faltando?`,
      opcoes: opcoes(p.s[pos], ()=>sorteia(sorteia(PALAVRAS).s))};
  }
  if(fase===2){
    const p = sorteia(PALAVRAS.filter(x=>x.s.length===2));
    return {tipo:'montar',
      pergunta:`Monte a palavra <span class="lacuna">${p.w}</span>`,
      visual:p.e, fala:`Monte a palavra ${p.w.toLowerCase()}, tocando nas sílabas na ordem certa.`,
      resposta:p.s};
  }
  if(rnd(2)===0){
    const p = sorteia(PALAVRAS.filter(x=>x.s.length===3));
    return {tipo:'montar',
      pergunta:`Monte a palavra <span class="lacuna">${p.w}</span>`,
      visual:p.e, fala:`Monte a palavra ${p.w.toLowerCase()}, tocando nas sílabas na ordem certa.`,
      resposta:p.s};
  }
  const p = sorteia(PALAVRAS);
  const distratores = embaralha(PALAVRAS.filter(x=>x.w!==p.w)).slice(0,2);
  return {tipo:'escolha', semLeituraOpcoes:true, // exercício de leitura: falar os nomes entregaria
    pergunta:`Qual figura combina com <span class="lacuna">${p.w}</span>?`,
    visual:`<div class="palavra-grande">${p.w}</div>`,
    fala:`Leia a palavra e toque na figura certa.`,
    opcoes: embaralha([{t:p.e,ok:true},...distratores.map(d=>({t:d.e,ok:false}))])};
}

/* ----- MISSÃO DOS NÚMEROS ----- */
function desafioNumeros(fase, i){
  const e = sorteia(CONTAVEIS);
  if(fase===0){
    const n = entre(1,5);
    return {tipo:'escolha',
      pergunta:`${quantos(e)} ${nome(e)} você vê?`,
      visual:emojis(e,n), fala:`Conte ${artOs(e)} ${nome(e)}. ${quantos(e)} são?`,
      opcoes: opcoes(n, ()=>entre(1,6))};
  }
  if(fase===1){
    if(i%2===0){
      const n = entre(4,10);
      return {tipo:'escolha',
        pergunta:`${quantos(e)} ${nome(e)} você vê?`,
        visual:emojis(e,n), fala:`Conte ${artOs(e)} ${nome(e)}. ${quantos(e)} são?`,
        opcoes: opcoes(n, ()=>entre(3,10))};
    }
    const alvo = entre(2,6);
    const outros = new Set([alvo]);
    while(outros.size<3) outros.add(entre(1,7));
    const lista = embaralha([...outros]);
    return {tipo:'escolha', semLeituraOpcoes:true, // contar em voz alta entregaria
      pergunta:`Toque no grupo com <span class="lacuna">${alvo}</span> ${e}`,
      visual:'👀', fala:`Toque no grupo que tem ${alvo}`,
      classeOpcao:'grupo',
      opcoes: lista.map(n=>({t:e.repeat(n), ok:n===alvo}))};
  }
  if(fase===2){
    if(i%2===0){
      const ini = entre(1,7);
      return {tipo:'escolha',
        pergunta:`Que número vem depois? <span class="lacuna">${ini}, ${ini+1}, ${ini+2}, __</span>`,
        visual:'🔢', fala:`${ini}, ${ini+1}, ${ini+2}... Que número vem depois?`,
        opcoes: opcoes(ini+3, ()=>entre(1,12))};
    }
    const querMais = rnd(2)===0;
    let a = entre(1,6), b = entre(1,6);
    while(a===b) b = entre(1,6);
    const certa = querMais ? Math.max(a,b) : Math.min(a,b);
    return {tipo:'escolha', semLeituraOpcoes:true,
      pergunta:`Toque no grupo que tem <span class="lacuna">${querMais?'MAIS':'MENOS'}</span> ${e}`,
      visual:'⚖️', fala:`Qual grupo tem ${querMais?'mais':'menos'}?`,
      classeOpcao:'grupo',
      opcoes: embaralha([{t:e.repeat(a),ok:a===certa},{t:e.repeat(b),ok:b===certa}])};
  }
  if(i%2===0){
    const n = entre(10,20);
    return {tipo:'escolha',
      pergunta:`${quantos(e)} ${nome(e)} você vê? (dica: conte de 5 em 5)`,
      visual:emojis(e,n), fala:`Conte ${artOs(e)} ${nome(e)}. ${quantos(e)} são?`,
      opcoes: opcoes(n, ()=>entre(9,20))};
  }
  const ini = entre(8,17);
  return {tipo:'escolha',
    pergunta:`Que número vem depois? <span class="lacuna">${ini}, ${ini+1}, ${ini+2}, __</span>`,
    visual:'🔢', fala:`${ini}, ${ini+1}, ${ini+2}... Que número vem depois?`,
    opcoes: opcoes(ini+3, ()=>entre(8,21))};
}

/* ----- MISSÃO DAS CONTINHAS ----- */
function desafioContinhas(fase){
  const e = sorteia(CONTAVEIS);
  if(fase<=1){
    const max = fase===0 ? 5 : 10;
    const a = entre(1, max-1), b = entre(1, max-a);
    return {tipo:'escolha',
      pergunta:`<span class="lacuna">${a} + ${b} = ?</span>`,
      visual:`${emojis(e,a)} <b style="color:#e17055">➕</b> ${emojis(e,b)}`,
      fala:`Quanto é ${a} mais ${b}? Conte ${artOs(e)} ${nome(e)} para ajudar.`,
      opcoes: opcoes(a+b, ()=>entre(1,max+2))};
  }
  if(fase===2){
    const a = entre(2,10), b = entre(1,a-1);
    return {tipo:'escolha',
      pergunta:`<span class="lacuna">${a} − ${b} = ?</span>`,
      visual:emojis(e,a,b),
      fala:`Quanto é ${a} menos ${b}? ${NOMES_CONTAVEIS[e].f?'As':'Os'} ${nome(e)} ${NOMES_CONTAVEIS[e].f?'apagadinhas':'apagadinhos'} foram embora.`,
      opcoes: opcoes(a-b, ()=>entre(0,a+1))};
  }
  /* Probleminhas estrelados pelos próprios cachorros! */
  const dog = sorteia(CACHORROS);
  const soma = rnd(2)===0;
  if(soma){
    const a = entre(2,6), b = entre(1,4);
    return {tipo:'escolha',
      pergunta:`${dog} tinha <span class="lacuna">${a}</span> ${e} e ganhou <span class="lacuna">${b}</span>. ${quantos(e)} tem agora?`,
      visual:`${emojis(e,a)} <b style="color:#e17055">➕</b> ${emojis(e,b)}`,
      fala:`${dog} tinha ${a} ${nome(e)} e ganhou mais ${b}. ${quantos(e)} tem agora?`,
      opcoes: opcoes(a+b, ()=>entre(2,11))};
  }
  const a = entre(3,9), b = entre(1,a-1);
  return {tipo:'escolha',
    pergunta:`O zumbizinho tinha <span class="lacuna">${a}</span> ${e} e perdeu <span class="lacuna">${b}</span>. ${quantos(e)} sobraram?`,
    visual:emojis(e,a,b),
    fala:`O zumbizinho tinha ${a} ${nome(e)} e perdeu ${b}. ${quantos(e)} sobraram?`,
    opcoes: opcoes(a-b, ()=>entre(0,a+1))};
}

/* ----- MISSÕES DE IDIOMAS (inglês, espanhol, francês) -----
   Dois tipos de desafio, alternados (método audiovisual):
   1) OUVIR a palavra no idioma e tocar na figura certa;
   2) VER a figura e escolher como se diz no idioma.
   Ao acertar, a palavra é repetida devagar — reforço de pronúncia. */
function geraDesafioIdioma(chave){
  const cfg = IDIOMAS[chave];
  return function(fase, i){
    const tema = VOCABULARIO[fase];
    const item = sorteia(tema);
    const palavra = item[chave];
    if(i%2===0){ // ouvir/ler a palavra e escolher a figura
      const distr = embaralha(tema.filter(x=>x!==item)).slice(0,2);
      return {tipo:'escolha',
        pergunta:`${cfg.bandeira} Ouça a palavra em <span class="lacuna">${cfg.nomeIdioma}</span> e toque na figura certa`,
        /* mostra a palavra escrita — associação som + escrita + imagem */
        visual:`👂 <div class="palavra-grande" style="letter-spacing:2px">${palavra}</div>`,
        fala:'Ouça e toque na figura certa.',
        estrangeira:{t:palavra, lang:cfg.lang, antes:true},
        opcoes: embaralha([{t:item.e,ok:true,nomeFala:item.pt},
          ...distr.map(d=>({t:d.e,ok:false,nomeFala:d.pt}))])};
    }
    // ver a figura e escolher a palavra no idioma
    return {tipo:'escolha',
      pergunta:`Como se diz <span class="lacuna">${item.pt.toUpperCase()}</span> em ${cfg.nomeIdioma}? ${cfg.bandeira}`,
      visual:item.e,
      fala:`Como se diz ${item.pt}?`,
      estrangeira:{t:palavra, lang:cfg.lang, antes:false},
      langOpcoes:cfg.lang, // as opções são lidas no idioma estrangeiro
      opcoes: opcoes(palavra, ()=>sorteia(tema)[chave])};
  };
}

/* ----- MISSÃO DAS HISTÓRIAS DE JESUS (valores) -----
   Uma historinha curta lida em voz alta + uma pergunta que liga
   o ensinamento à vida da criança. Sem sustos, só coisas boas. */
function desafioValores(fase, i){
  const item = HISTORIAS_JESUS[fase][i % HISTORIAS_JESUS[fase].length];
  return {tipo:'escolha',
    pergunta:`<div class="historia">${item.h}</div>${item.p}`,
    visual:item.e,
    fala:`${item.h} ${item.p}`,
    classeOpcao:'texto',
    opcoes: embaralha([{t:item.certa,ok:true},...item.erradas.map(t=>({t,ok:false}))])};
}

/* ----- MISSÃO DAS FORMAS GEOMÉTRICAS ----- */
function desafioFormas(fase, i){
  if(fase===0){ // reconhecer a forma
    const alvo = sorteia(FORMAS);
    const distr = embaralha(FORMAS.filter(f=>f!==alvo)).slice(0,2);
    return {tipo:'escolha', semLeituraOpcoes:true, // falar os nomes entregaria
      pergunta:`Toque no <span class="lacuna">${alvo.n}</span>`,
      visual:'🔎', fala:`Toque na forma: ${alvo.fala}`,
      opcoes: embaralha([{t:alvo.e,ok:true},...distr.map(f=>({t:f.e,ok:false}))])};
  }
  if(fase===1){ // objetos do dia a dia e suas formas
    const alvo = sorteia(FORMAS.slice(0,3)); // círculo, quadrado e triângulo têm objetos
    const objCerto = sorteia(OBJETOS_FORMA.filter(o=>o.forma===alvo.n));
    const distr = embaralha(OBJETOS_FORMA.filter(o=>o.forma!==alvo.n)).slice(0,2);
    return {tipo:'escolha',
      pergunta:`Qual objeto tem a forma de um <span class="lacuna">${alvo.n}</span>? ${alvo.e}`,
      visual:alvo.e, fala:`Qual objeto tem a forma de um ${alvo.fala}?`,
      opcoes: embaralha([{t:objCerto.e,ok:true,nomeFala:objCerto.nome},
        ...distr.map(o=>({t:o.e,ok:false,nomeFala:o.nome}))])};
  }
  if(fase===2){ // contar uma forma no meio de outras (atenção!)
    const alvo = sorteia(FORMAS.slice(0,4));
    const n = entre(2,5);
    const outras = FORMAS.filter(f=>f!==alvo);
    const mistura = [...Array(n).fill(alvo.e)];
    for(let k=0, extras=entre(3,5); k<extras; k++) mistura.push(sorteia(outras).e);
    return {tipo:'escolha',
      pergunta:`${alvo.f?'Quantas':'Quantos'} <span class="lacuna">${alvo.pl}</span> ${alvo.e} você vê?`,
      visual: embaralha(mistura).join(''),
      fala:`${alvo.f?'Quantas':'Quantos'} ${alvo.pl.toLowerCase()} você vê? Cuidado, tem outras formas no meio!`,
      opcoes: opcoes(n, ()=>entre(1,7))};
  }
  // fase 3: completar a sequência (padrões)
  const a = sorteia(FORMAS), b = sorteia(FORMAS.filter(f=>f!==a));
  const abab = rnd(2)===0;
  const seq  = abab ? [a,b,a,b,a] : [a,a,b,b,a];
  const prox = abab ? b : a;
  const outra = sorteia(FORMAS.filter(f=>f!==a && f!==b)); // garante 3 opções diferentes
  return {tipo:'escolha',
    pergunta:`O que vem depois na sequência?`,
    visual: seq.map(f=>f.e).join(' ') + ' <span class="lacuna">?</span>',
    fala:`Olhe a sequência de formas. O que vem depois?`,
    opcoes: embaralha([{t:prox.e,ok:true,nomeFala:prox.fala},
      {t:(prox===a?b:a).e,ok:false,nomeFala:(prox===a?b:a).fala},
      {t:outra.e,ok:false,nomeFala:outra.fala}])};
}

/* ----- DESAFIO FINAL: mistura tudo ----- */
function desafioFinal(fase, i){
  const geradores = [desafioLetras, desafioSilabas, desafioNumeros, desafioContinhas, desafioFormas];
  return geradores[i % geradores.length](fase, i);
}

/* De vez em quando um cachorrinho pula e late — vida na cena! */
let animTimer = null;
function animacoesDivertidas(){
  clearInterval(animTimer);
  animTimer = setInterval(()=>{
    const m = document.getElementById('matilha');
    if(!m){ clearInterval(animTimer); return; }
    const dogs = m.querySelectorAll('.dog');
    const dog = dogs[rnd(dogs.length)];
    dog.classList.add('pula');
    if(rnd(2)===0){
      const b = document.createElement('span');
      b.className = 'balao';
      b.textContent = sorteia(['Au au!','🦴','💛','🎵','Au!']);
      dog.appendChild(b);
      setTimeout(()=>b.remove(), 1300);
    }
    setTimeout(()=>dog.classList.remove('pula'), 600);
  }, 3200);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('mostra');
  setTimeout(()=>t.classList.remove('mostra'), 1600);
}
/* Faixa de feedback DENTRO da cena — sempre visível, nunca bloqueia toques */
let bannerTimer = null;
function banner(msg, classe){
  const b = document.getElementById('banner');
  if(!b) return;
  b.textContent = msg;
  b.className = 'mostra '+classe;
  clearTimeout(bannerTimer);
  bannerTimer = setTimeout(()=>{ b.className = ''; }, 1500);
}
function confetes(qtd=36){
  for(let i=0;i<qtd;i++){
    const c = document.createElement('div');
    c.className = 'confete';
    c.textContent = sorteia(['🎉','⭐','💛','💙','💜','✨']);
    c.style.left = rnd(100)+'vw';
    c.style.animationDuration = (2+Math.random()*2)+'s';
    c.style.animationDelay = (Math.random()*0.8)+'s';
    document.body.appendChild(c);
    setTimeout(()=>c.remove(), 5000);
  }
}
/* "+10 💎" voando de cima do botão que a criança acertou */
function cristalVoa(botao, ganho){
  const r = botao.getBoundingClientRect();
  const s = document.createElement('span');
  s.className = 'cristal-voa';
  s.textContent = `+${ganho} 💎`;
  s.style.left = (r.left + r.width/2 - 30)+'px';
  s.style.top  = (r.top - 10)+'px';
  document.body.appendChild(s);
  setTimeout(()=>s.remove(), 1200);
}

function botaoSom(){
  return `<button class="icone-btn" onclick="alternarSom()" title="Ligar ou desligar o som">
    ${estado.som ? '🔊' : '🔇'}</button>`;
}
function alternarSom(){
  estado.som = !estado.som; salvar();
  if(!estado.som && 'speechSynthesis' in window) speechSynthesis.cancel();
  document.querySelectorAll('.icone-btn').forEach(b=>{
    if(b.textContent.includes('🔊')||b.textContent.includes('🔇'))

  somClique();
}

function telaFases(missaoId){
  const m = MISSOES[missaoId];
  const bolas = ['🪐','🌕','🌍','⭐'];
  let planetas = '';
  for(let f=0; f<FASES_POR_MISSAO; f++){

    <div class="subtitulo">${m.intro}</div>

/* ============================================================
   9. FLUXO DE UMA FASE
   A cena (cães, casa, zumbi) é montada UMA vez; a cada desafio
   só trocamos o cartão de pergunta e o zumbi — assim os cães
   caminham suavemente pela tela conforme a criança acerta.
   ============================================================ */
let jogo = null;
let inicioSessao = Date.now(); // controla o lembrete gentil de descanso

/* Impressão digital de um desafio, para não repetir na mesma fase */
function chaveDesafio(d){
  const alvo = d.opcoes ? d.opcoes.find(o=>o.ok).t : d.resposta.join('');
  return d.pergunta.replace(/<[^>]+>/g,'') + '|' + alvo;
}

function iniciarFase(missaoId, fase){
  const gen = MISSOES[missaoId].gen;
  /* Gera os desafios SEM repetição: se sair igual, sorteia de novo */
  const desafios = [], vistos = new Set();
  for(let i=0; i<DESAFIOS_POR_FASE; i++){
    let d, tentativas = 0;
    do{ d = gen(fase, i); }while(vistos.has(chaveDesafio(d)) && ++tentativas < 25);
    vistos.add(chaveDesafio(d));
    desafios.push(d);
  }
  const cenario = sorteia(CENARIOS);  // micro-história da vez
  jogo = { missaoId, fase, desafios, cenario, atual:0, erros:0,
           errouNesta:false, bloqueado:false, introFala:cenario.texto };
  app.innerHTML = `
    <div class="hud">
      <button class="icone-btn" onclick="somClique();telaFases('${missaoId}')">⬅️</button>
      <span class="pontos">💎 <span id="cristaisHud">${estado.cristais}</span></span>
      ${botaoSom()}
    </div>
    <div class="dots" id="dots"></div>
    ${htmlCena(cenario)}
    <div class="cartao" id="cartao"></div>`;
  banner(cenario.texto, 'bom');
  animacoesDivertidas();
  mostrarDesafio();
}

function mostrarDesafio(){
  const d = jogo.desafios[jogo.atual];
  jogo.errouNesta = false;
  jogo.errosNesteDesafio = 0; // conta erros para dar ajuda adaptativa
  jogo.bloqueado = false;   // libera os toques para o novo desafio

  /* Bolinhas de progresso */
  let dots = '';
  for(let i=0;i<DESAFIOS_POR_FASE;i++)
    dots += `<span class="dot ${i<jogo.atual?'feito':i===jogo.atual?'atual':''}"></span>`;
  document.getElementById('dots').innerHTML = dots;

  /* Cães avançam até a posição do desafio atual (transição CSS anima) */
  document.getElementById('matilha').style.left = POSICOES[jogo.atual];

  /* Novos zumbis chegam para bloquear o caminho — quanto mais
     difícil a fase, mais zumbizinhos aparecem juntos! */
  const z = document.getElementById('zumbiCena');
  z.className = ''; void z.offsetWidth;      // reinicia a animação de entrada
  const qtdZumbis = 1 + (jogo.fase>=2 ? 1 : 0) + (jogo.fase>=3 ? 1 : 0);
  let zumbis = `<div class="chapeu">${CHAPEUS[jogo.atual % CHAPEUS.length]}</div>`;
  for(let k=0; k<qtdZumbis; k++) zumbis += htmlZumbi('z'+k);
  z.innerHTML = zumbis;
  z.className = 'entrando';

  /* Cartão da pergunta + área de resposta */
  let area = '';
  if(d.tipo==='escolha'){
    /* Cada opção ganha o número 1/2/3 — a voz lê "Opção 1..." e a
       criança que ainda não lê escolhe pelo número que ouviu */
    area = `<div class="opcoes">` + d.opcoes.map((o,ix)=>
      `<button class="opcao ${d.classeOpcao||''}" data-ix="${ix}"
        onclick="responder(${ix},this)"><span class="num-opcao">${ix+1}</span>${o.t}</button>`).join('') + `</div>`;
  }else{
    const slots = d.resposta.map(()=>`<div class="slot"></div>`).join('');
    const pecas = embaralha(d.resposta.map((s,ix)=>({s,ix}))).map(p=>
      `<button class="peca" data-silaba="${p.s}" onclick="encaixar(this)">${p.s}</button>`).join('');
    area = `<div class="slots" id="slots">${slots}</div><div class="pecas">${pecas}</div>`;
    jogo.preenchidos = 0;
  }
  document.getElementById('cartao').innerHTML = `
    <div class="pergunta">${d.pergunta}</div>
    <div class="visual">${d.visual||''}</div>
    ${area}
    <button class="btn-falar" onclick="falarDesafio(jogo.desafios[jogo.atual])" title="Ouvir de novo">🔊</button>`;
  falarDesafio(d);
}

/* Resposta de múltipla escolha */
function responder(ix, botao){
  if(jogo.bloqueado) return;  // ignora toques repetidos durante a comemoração
  const d = jogo.desafios[jogo.atual];
  if(d.opcoes[ix].ok){
    jogo.bloqueado = true;
    botao.classList.add('certa');
    document.querySelectorAll('.opcao').forEach(b=>b.disabled = true);
    acertou(botao);
  }else{
    botao.classList.add('errada');
    setTimeout(()=>botao.classList.remove('errada'), 450);
    errou();
  }
}

/* Encaixar sílaba no desafio de montar palavra */
function encaixar(peca){
  if(jogo.bloqueado) return;
  const d = jogo.desafios[jogo.atual];
  const esperada = d.resposta[jogo.preenchidos];
  if(peca.dataset.silaba === esperada){
    const slot = document.querySelectorAll('#slots .slot')[jogo.preenchidos];
    slot.textContent = esperada; slot.classList.add('cheio');
    peca.disabled = true;
    jogo.preenchidos++;
    somClique();
    if(jogo.preenchidos === d.resposta.length){ jogo.bloqueado = true; acertou(peca); }
  }else{
    peca.classList.add('errada');
    setTimeout(()=>peca.classList.remove('errada'), 450);
    errou();
  }
}

/* ----- ACERTOU: zumbi vai embora num puff, cães avançam ----- */
function acertou(botao){
  const d = jogo.desafios[jogo.atual];
  const ganho = jogo.errouNesta ? 5 : 10;   // acertar de primeira vale mais
  estado.cristais += ganho;
  /* Registra a tentativa na habilidade desta fase (últimas 8):
     é isso que alimenta o painel pedagógico dos pais */
  const chaveHab = jogo.missaoId+'-'+jogo.fase;
  const historico = estado.tentativas[chaveHab] || [];
  historico.push(jogo.errouNesta ? 0 : 1);
  estado.tentativas[chaveHab] = historico.slice(-8);
  salvar();

  /* 1) AVANÇO GARANTIDO primeiro: mesmo que som, voz ou animação
     falhem no aparelho, o jogo nunca trava neste ponto */
  setTimeout(()=>{
    jogo.atual++;
    if(jogo.atual < DESAFIOS_POR_FASE) mostrarDesafio();
    else telaRecompensa();
  }, 1600);

  /* 2) Efeitos visuais e sonoros */
  try{
    somAcerto();
    const hud = document.getElementById('cristaisHud');
    if(hud) hud.textContent = estado.cristais;
    const msg = sorteia(MSG_ACERTO);
    banner(`${msg} 🎉`, 'bom');
    if(botao) cristalVoa(botao, ganho);

    /* Zumbi derrotado: gira, some e vira fumacinha */
    const z = document.getElementById('zumbiCena');
    z.classList.add('derrotado');
    setTimeout(()=>{ somPoof(); z.innerHTML = '<div class="puff">💨</div>'; z.className=''; }, 550);

    /* Cães dão um passo em direção à casa */
    document.getElementById('matilha').style.left = POSICOES[jogo.atual+1];

    /* Nos idiomas, repete a palavra estrangeira após o elogio —
       reforço de pronúncia, como nos apps de idiomas para crianças */
    if(d.estrangeira) falarSeq([{t:msg},{t:d.estrangeira.t, lang:d.estrangeira.lang}]);
    else falar(msg);
  }catch(e){/* efeitos nunca podem impedir o avanço */}
}

/* ----- ERROU: zumbi dá risada boba, mensagem gentil, tenta de novo -----
   Ajuda adaptativa (pesquisa pedagógica): no 2º erro o jogo NÃO fica
   mais difícil — ele APOIA: esconde uma opção errada e repete o
   enunciado mais devagar, preservando a autoestima da criança. */
function errou(){
  if(!jogo.errouNesta){ jogo.erros++; jogo.errouNesta = true; }
  jogo.errosNesteDesafio = (jogo.errosNesteDesafio||0) + 1;
  somErro();
  const z = document.getElementById('zumbiCena');
  if(z){ z.classList.add('riso'); setTimeout(()=>z.classList.remove('riso'), 500); }

  const d = jogo.desafios[jogo.atual];
  if(jogo.errosNesteDesafio === 2 && d.tipo === 'escolha'){
    const botoes = [...document.querySelectorAll('.opcao')];
    const escondiveis = botoes.filter((b,ix)=>
      !d.opcoes[b.dataset.ix||ix].ok && b.style.visibility !== 'hidden');
    if(escondiveis.length > 1){ // mantém sempre 1 certa + 1 errada
      escondiveis[0].style.visibility = 'hidden';
      banner('💡 Ajudinha: tirei uma opção! Escute de novo.', 'quase');
      falarSeq([{t:'Vou te ajudar! Escute com calma:', rate:0.9},{t:d.fala, rate:0.78}]);
      return;
    }
  }
  const msg = sorteia(MSG_ERRO);
  banner(msg, 'quase');
  falar(msg.replace(/[^\wÀ-ú ?!.]/g,''));
}

/* ----- Fim da fase: os cães chegaram em casa! ----- */
function telaRecompensa(){
  const chave = jogo.missaoId+'-'+jogo.fase;
  const estrelas = jogo.erros===0 ? 3 : jogo.erros<=2 ? 2 : 1;
  const antes = estado.estrelas[chave]||0;
  estado.estrelas[chave] = Math.max(antes, estrelas);
  let adesivoNovo = '';
  if(!estado.adesivos.includes(chave)){
    estado.adesivos.push(chave);
    const fig = ADESIVOS[(ORDEM_MISSOES.indexOf(jogo.missaoId)*FASES_POR_MISSAO + jogo.fase) % ADESIVOS.length];
    adesivoNovo = `<div class="adesivo-novo">🎁 Você ganhou um adesivo novo!<br>
      <span class="fig">${fig}</span></div>`;
  }
  salvar(); somVitoria(); confetes();

  /* Sessões curtas aprendem mais (10–15 min): depois de ~15 minutos
     jogando, sugerimos um descanso — sem bloquear nada */
  let descanso = '';
  if((Date.now() - inicioSessao)/60000 >= 15){
    descanso = `<div class="adesivo-novo" style="border-color:var(--roxo)">
      😴💤 Vocês já jogaram bastante por hoje!<br>
      Dora, Oreo e Cacau vão tirar uma soneca.<br>
      <b>Que tal um descanso e voltar amanhã?</b></div>`;
    inicioSessao = Date.now();
  }

  const temProxima = jogo.fase+1 < FASES_POR_MISSAO;
  const missaoId = jogo.missaoId, proxFase = jogo.fase+1;
  app.innerHTML = `
    <div class="hud"><span></span>${botaoSom()}</div>
    <h1 style="font-size:1.5rem">${jogo.cenario.fim}</h1>
    <div class="estrelas-grandes">${'<span>⭐</span>'.repeat(estrelas)}${'<span style="opacity:.25">⭐</span>'.repeat(3-estrelas)}</div>
    <div class="mascotes">${htmlTrio()}<span style="font-size:3rem">${jogo.cenario.meta}</span></div>
    <div class="subtitulo">Dora, Oreo e Cacau agradecem sua ajuda!<br>💎 +${DESAFIOS_POR_FASE*10 - jogo.erros*5} cristais de conhecimento</div>
    ${adesivoNovo}
    ${descanso}
    ${temProxima ? `<button class="btn btn-verde" onclick="somClique();iniciarFase('${missaoId}',${proxFase})">➡️ Próxima fase</button>` : ''}
    <button class="btn btn-amarelo" onclick="somClique();iniciarFase('${missaoId}',${jogo.fase})">🔁 Jogar de novo</button>
    <button class="btn" onclick="somClique();telaMissoes()">🗺️ Mapa de missões</button>`;
  falar(`Parabéns! Missão cumprida! Você ganhou ${estrelas} ${estrelas===1?'estrela':'estrelas'}!`);
}

/* ============================================================
   10. TELA "PARA OS PAIS" (progresso pedagógico por habilidade)
   Estado calculado sobre as últimas 8 tentativas de cada fase:
   novo → começando → praticando → dominado (modelo recomendado
   por evidências de apps de alfabetização).
   ============================================================ */
function statusHabilidade(chave){
  const arr = estado.tentativas[chave] || [];
  if(arr.length === 0) return {i:'▫️', r:'não praticou'};
  if(arr.length < 3)   return {i:'🌱', r:'começando'};
  const taxa = arr.reduce((a,b)=>a+b,0) / arr.length;
  if(taxa >= 0.8) return {i:'🌟', r:'dominado'};
  if(taxa >= 0.5) return {i:'💪', r:'praticando'};
  return {i:'🤝', r:'praticar junto'};
}

function telaProgresso(){
  let totalEstrelas = 0;
  const linhas = ORDEM_MISSOES.map(id=>{
    const m = MISSOES[id];
    let fases = '';
    for(let f=0; f<FASES_POR_MISSAO; f++){
      const g = estado.estrelas[id+'-'+f]||0;
      totalEstrelas += g;
      fases += g>0 ? '⭐'.repeat(g)+' ' : '▫️ ';
    }
    /* Sub-linhas: uma habilidade por fase, com estado pedagógico */
    const habilidades = (m.temas || []).map((tema,f)=>{
      const s = statusHabilidade(id+'-'+f);
      return `<div class="hab-linha"><span>${s.i} ${tema}</span><span class="hab-rotulo">${s.r}</span></div>`;
    }).join('');
    return `<div class="linha-prog"><span>${m.icone} ${m.nome}</span><span>${fases}</span></div>${habilidades}`;
  }).join('');

  const figuras = ADESIVOS.map((fig,ix)=>{
    const ganho = estado.adesivos.some(ch=>{
      const [mid,f] = ch.split('-');
      return ORDEM_MISSOES.indexOf(mid)*FASES_POR_MISSAO + Number(f) === ix;
    });
    return `<span class="ad ${ganho?'':'vazio'}">${fig}</span>`;
  }).join('');

  app.innerHTML = `
    <div class="hud">
      <button class="icone-btn" onclick="somClique();telaInicial()">🏠</button>
      <span class="pontos">💎 <span id="cristaisHud">${estado.cristais}</span></span>
      ${botaoSom()}
    </div>
    <h1 style="font-size:1.4rem">📊 Progresso</h1>
    <div class="subtitulo">Cada fase vale até 3 estrelas (▫️ = ainda não feita)</div>
    <div class="legenda-hab">🌟 dominado &nbsp;·&nbsp; 💪 praticando &nbsp;·&nbsp; 🌱 começando &nbsp;·&nbsp; 🤝 vale praticar acompanhado</div>
    <div class="tabela-prog">${linhas}
      <div class="linha-prog"><b>Total</b><b>⭐ ${totalEstrelas} de ${ORDEM_MISSOES.length*FASES_POR_MISSAO*3}</b></div>
    </div>
    <div class="subtitulo">🎁 Álbum de adesivos (${estado.adesivos.length} de ${ADESIVOS.length})</div>
    <div class="adesivos-grid">${figuras}</div>
    ${htmlNuvem()}
    <button class="btn" onclick="somClique();telaMissoes()">▶️ Continuar jogando</button>
    <button class="btn" style="background:linear-gradient(180deg,#b2bec3,#636e72);font-size:1rem"
      onclick="apagarProgresso()">🗑️ Apagar progresso</button>`;
}
/* Caixinha de sincronização (só aparece se a nuvem estiver configurada) */
function htmlNuvem(){
  if(!SUPABASE_URL || !SUPABASE_ANON_KEY) return '';
  if(nuvem.usuario)
    return `<div class="tabela-prog" style="text-align:center">
      ☁️ Sincronizado entre os aparelhos como<br><b>${nuvem.usuario.email}</b> ✅</div>`;
  return `<div class="tabela-prog" style="text-align:center">
    ☁️ <b>Sincronizar entre aparelhos</b><br>
    <input id="emailNuvem" class="campo-email" type="email" placeholder="e-mail do adulto responsável">
    <button class="btn btn-roxo" style="font-size:1rem" onclick="conectarNuvem()">📩 Enviar link mágico</button>
    <div style="font-size:.78rem;opacity:.8">Sem senha: chega um link no e-mail, é só tocar nele neste aparelho.<br>
    Repita em cada celular/tablet da família com o MESMO e-mail.</div></div>`;
}

function apagarProgresso(){
  if(confirm('Apagar todo o progresso? Esta ação não pode ser desfeita.')){
    estado = {som:estado.som, cristais:0, estrelas:{}, adesivos:[]};
    salvar(); telaProgresso();
  }
}

/* ============================================================
   11. INICIALIZAÇÃO: fundo estrelado + primeira tela
   ============================================================ */
(function criarEstrelas(){
  const cont = document.getElementById('estrelas');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className = 'estrela';
    const tam = 1+Math.random()*3;
    s.style.cssText = `left:${rnd(100)}vw;top:${rnd(100)}vh;width:${tam}px;height:${tam}px;
      animation-delay:${Math.random()*3}s;animation-duration:${2+Math.random()*3}s`;
    cont.appendChild(s);
  }
})();

/* PWA: registra o service worker (só quando publicado em um site) */
if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  try{ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }catch(e){}
}
iniciarNuvem();   // liga a sincronização, se configurada
telaInicial();
</script>
